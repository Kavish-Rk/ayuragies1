<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1B4332"/>
      <stop offset="100%" stopColor="#134E4A"/>
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10B981"/>
      <stop offset="100%" stopColor="#D1FAE5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#022c22" floodOpacity="0.1" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>

  <g transform="translate(200, 150)" filter="url(#softShadow)">
    {/* Stylized Anatomical 'A' (Femur and Tibia representation) */}
    <path d="M 0 -70 L 40 40 C 45 55 35 70 20 70 L 15 70 C 0 70 -5 55 0 40 Z" fill="url(#gradDark)" />
    <path d="M 0 -70 L -40 40 C -45 55 -35 70 -20 70 L -15 70 C 0 70 5 55 0 40 Z" fill="#134E4A" />
    
    {/* Abstract Joint Space (Patella region / A crossbar) */}
    <circle cx="0" cy="15" r="18" fill="url(#gradDark)" stroke="#FAFAF5" strokeWidth="6" />
    <circle cx="0" cy="15" r="10" fill="#D1FAE5" />
    
    {/* Smooth Orbital Motion Ring */}
    <ellipse cx="0" cy="5" rx="75" ry="35" fill="none" stroke="url(#gradMint)" strokeWidth="4" transform="rotate(-15)" strokeDasharray="300" strokeDashoffset="40"/>
    
    {/* Tracking Data Node (AI / Sensor) */}
    <circle cx="-62" cy="22" r="7" fill="#fde047" stroke="#ffffff" strokeWidth="2" filter="url(#glow)"/>
    
    {/* Dynamic motion dots */}
    <circle cx="68" cy="-12" r="3" fill="#D1FAE5" filter="url(#glow)" />
    <circle cx="50" cy="-28" r="2" fill="#D1FAE5" opacity="0.6"/>
  </g>

  {/* Brand Wordmark */}
  <g transform="translate(200, 290)">
    <text x="0" y="0" textAnchor="middle" fill="#1B4332" fontFamily="'Inter', 'Plus Jakarta Sans', sans-serif" fontSize="36" fontWeight="800" letterSpacing="4">AYURAGIES</text>
    <text x="0" y="28" textAnchor="middle" fill="#475569" fontFamily="'Inter', 'Plus Jakarta Sans', sans-serif" fontSize="13" fontWeight="500" letterSpacing="2">AI FOR HEALTHIER KNEES</text>
  </g>
</svg>